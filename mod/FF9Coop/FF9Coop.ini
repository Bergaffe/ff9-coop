; FF9 Coop - settings (most of them can also be changed in-game: K or L3+R3)
; Players are counted from 1. Out-of-range values are clamped.

[Main]
Enabled = 1
; Language of menu and messages: Auto (follows the game language), English, German
Language = Auto

[Players]
; Number of players (1-4)
Count = 2
; The leader controls field, world map, dialogs and Tetra Master
Leader = 1
; Which player owns the keyboard
Keyboard = 1
; XInput controller slot -> player.
; With Steam Remote Play Together the host is usually Pad1 and the guest Pad2.
Pad1 = 1
Pad2 = 2
Pad3 = 1
Pad4 = 2

[Control]
; Who may open the main menu, shops etc.: Anyone or Leader
MenuControl = Anyone
; The waiting player takes over their ready character with Y/Triangle (1 = on)
BattleTurnRequest = 1
; Pause ATB while a player is choosing in the command menu (1 = on; fair online and with hard mods)
BattlePause = 0
; Short vibration on your own controller when one of your characters is ready
ReadySignal = 1
; P1/P2 markers next to the names in the battle party display
BattleMarkers = 1
; "I'm here" hand per player, coloured with number: 0 = original, 1 = on entering a screen (like the game), 2 = always
PlayerHands = 1
; Block the keyboard while its player is not in control (0 = keyboard always allowed)
GateKeyboard = 1
; Small status display in the top left corner
ShowHud = 1
; Keyboard key for "turn request" in battle (controller: Y/Triangle)
TurnRequestKey = T
; Take over as leader (only in the field/world map outside cutscenes): hold this key or
; Back/Select or L2 + R2 on the controller. Only the player who is currently not the leader.
LeaderKey = L
LeaderHoldSeconds = 1.0
; Open the co-op menu (controller: L3+R3, i.e. press both sticks)
MenuKey = K
; Solo sections (the game lets you control only one character): Ask = "Who plays ...?" window,
; Keep = the leader continues without asking, P1/P2/... = this player always takes over
SoloScenePrompt = Ask

[Companion]
; Visible companion character in the field for the player who is not the leader (1 = on)
Enabled = 1
; Preferred companion (Vivi, Garnet, Steiner, ...) or Auto = first party member other than the leader
Character = Auto
; Maximum distance to the leader, after that the companion is brought back
Leash = 2000
; Run key for a keyboard companion (controller: hold B, like in the game)
RunKey = LeftShift
; Companion on the world map too (on foot only) and its leash there in world units
WorldMap = 1
WorldLeash = 12

[CompanionModels]
; Optional: field model per character for the companion (e.g. for characters from other mods).
; All 8 main characters plus Cinna, Marcus, Blank and Beatrix are already known.
; Beatrix = GEO_SUB_F0_BTX

[Owners]
; Character -> player. 0 or missing = automatic (alternating by battle slot).
; Starting party disc 1: P1 = Zidane + Steiner, P2 = Vivi + Garnet
Zidane = 1
Vivi = 2
Garnet = 2
Steiner = 1
Freya = 1
Quina = 2
Eiko = 2
Amarant = 1
Cinna = 0
Marcus = 0
Blank = 0
Beatrix = 0
