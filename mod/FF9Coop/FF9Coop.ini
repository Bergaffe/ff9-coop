; FF9 Coop – Einstellungen
; Spieler werden ab 1 gezählt. Werte außerhalb des gültigen Bereichs werden begrenzt.

[Main]
Enabled = 1

[Players]
; Anzahl Spieler (1-4)
Count = 2
; Leader steuert Feld, Weltkarte, Dialoge und Tetra Master
Leader = 1
; Wem die Tastatur gehört
Keyboard = 1
; XInput-Controller-Slot -> Spieler.
; Bei Steam Remote Play Together ist der Host meist Pad1, der Gast Pad2.
Pad1 = 1
Pad2 = 2
Pad3 = 1
Pad4 = 2

[Control]
; Wer darf ins Hauptmenü, in Shops usw.: Anyone (jeder) oder Leader
MenuControl = Anyone
; Wartender Spieler holt mit Y/Dreieck seinen bereiten Charakter (1 = an)
BattleTurnRequest = 1
; Tastatur sperren, wenn ihr Spieler nicht dran ist (0 = Tastatur darf immer)
GateKeyboard = 1
; Kleine Statusanzeige oben links
ShowHud = 1
; Tastatur-Taste fuer "Zug anfordern" im Kampf (Controller: Y/Dreieck)
TurnRequestKey = T
; Leader uebernehmen (nur im Feld/auf der Weltkarte ohne Cutscene): diese Taste bzw.
; am Controller Back/Select so lange halten. Nur der Spieler, der gerade nicht Leader ist.
LeaderKey = L
LeaderHoldSeconds = 1.0
; Koop-Menue oeffnen (Controller: L3+R3, also beide Sticks druecken)
MenuKey = K
; "Wer spielt ...?"-Fenster, wenn das Spiel die gesteuerte Figur wechselt (1 = an)
SoloScenePrompt = 1

[Companion]
; Sichtbare Begleiter-Figur im Feld fuer den Spieler, der nicht Leader ist (1 = an)
Enabled = 1
; Bevorzugter Begleiter (Vivi, Garnet, Steiner, ...) oder Auto = erstes Party-Mitglied ausser dem Leader
Character = Auto
; Maximaler Abstand zum Leader, danach wird der Begleiter zurueckgeholt
Leash = 2000
; Laufen fuer Tastatur-Begleiter (Controller: B halten, wie im Spiel)
RunKey = LeftShift
; Begleiter auch auf der Weltkarte (nur zu Fuss) und Leine dort in Welt-Einheiten
WorldMap = 1
WorldLeash = 12

[Owners]
; Charakter -> Spieler. 0 oder fehlend = automatisch (Kampf-Slot abwechselnd).
; Startparty Disc 1: P1 = Zidane + Steiner, P2 = Vivi + Garnet
Zidane = 1
Vivi = 2
Garnet = 2
Steiner = 1
Freya = 1
Quina = 2
Eiko = 2
Amarant = 1
Cinna = 0
Marcus = 0
Blank = 0
Beatrix = 0
